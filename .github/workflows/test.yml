name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Dummy keys so modules that read the env import cleanly. No test makes a
        # real API call — the LLM chain is fully mocked in test_llm_chain.py.
        env:
          GOOGLE_API_KEY: ci-dummy-key
          GROQ_API_KEY: ci-dummy-key
        run: pytest -q
